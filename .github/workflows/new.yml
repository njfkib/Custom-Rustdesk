name: Custom RustDesk Build2026

on:
  workflow_dispatch:
    inputs:
      rustdesk_version:
        description: 'RustDesk官方版本'
        required: true
        default: '1.4.7'
        type: choice
        options:
          - '1.4.7'
          - '1.4.6'
          - '1.4.5'
      custom_app_name:
        description: '自定义程序名称'
        required: true
        default: "CustomRustdesk"
      custom_api_url:
        description: '自建API地址'
        required: true
        default: "https://api.example.com"
      custom_window_title:
        description: '窗口标题'
        required: true
        default: "自建远程桌面"
      fixed_id:
        description: '客户端内置固定ID'
        required: true
        default: "123456789"
      fixed_pass:
        description: '客户端内置固定密码'
        required: true
        default: "MyPass123"

env:
  RUSTUP_DIST_SERVER: https://mirrors.ustc.edu.cn/rust-static
  RUSTUP_UPDATE_ROOT: https://mirrors.ustc.edu.cn/rust-static/rustup
  FLUTTER_VERSION: 3.22.2

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]
        runner: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout custom repo
        uses: actions/checkout@v4
        with:
          path: ./
          submodules: false

      - name: Clone RustDesk official source ${{ github.event.inputs.rustdesk_version }}
        run: |
          git clone --depth=1 --branch ${{ github.event.inputs.rustdesk_version }} https://github.com/rustdesk/rustdesk.git rustdesk-src
          cd rustdesk-src
          git submodule update --init --recursive

      - name: Replace App Icon
        run: |
          ${{ matrix.os == 'windows' && 'Copy-Item ${{ github.workspace }}/assets/icon.png rustdesk-src/flutter/assets/icon.png -Force' || 'cp ${{ github.workspace }}/assets/icon.png rustdesk-src/flutter/assets/icon.png' }}

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev pkg-config libgtk-3-dev libayatana-appindicator3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libspeechd-dev libxkbcommon-dev libssl-dev

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustdesk-src

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Modify Config & Flutter Code (Linux/macOS sed)
        if: matrix.os != 'windows'
        run: |
          cd rustdesk-src
          ls libs/hbb_common/src/
          # 修改中继服务器
          sed -i "s|pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[.*\];|pub const RENDEZVOUS_SERVERS: &\[&str\] = &[\"${{ secrets.RELAY_SERVER }}\"];|" libs/hbb_common/src/config.rs
          # 修改公钥
          sed -i "s|pub const RS_PUB_KEY: &str = .*;|pub const RS_PUB_KEY: &str = \"${{ secrets.PUBLIC_KEY }}\";|" libs/hbb_common/src/config.rs
          # 修改API地址
          sed -i "s|pub const API_URL: &str = .*;|pub const API_URL: &str = \"${{ github.event.inputs.custom_api_url }}\";|" libs/hbb_common/src/config.rs
          # 内置固定ID
          sed -i "s|pub const FIXED_ID: Option<&str> = None;|pub const FIXED_ID: Option<&str> = Some(\"${{ github.event.inputs.fixed_id }}\");|" libs/hbb_common/src/config.rs
          # 内置固定密码
          sed -i "s|pub const FIXED_PASSWORD: Option<&str> = None;|pub const FIXED_PASSWORD: Option<&str> = Some(\"${{ github.event.inputs.fixed_pass }}\");|" libs/hbb_common/src/config.rs

          # 修改窗口标题，关闭自动更新、关闭遥测
          sed -i "s|title: 'RustDesk'|title: '${{ github.event.inputs.custom_window_title }}'|g" flutter/lib/main.dart
          sed -i "s|checkUpdate();|//checkUpdate();|g" flutter/lib/main.dart
          sed -i "s|enableTelemetry = true;|enableTelemetry = false;|g" flutter/lib/main.dart

      - name: Modify Config & Flutter Code (Windows PowerShell)
        if: matrix.os == 'windows'
        run: |
          cd rustdesk-src
          ls libs/hbb_common/src/
          $configFile = "libs/hbb_common/src/config.rs"
          $content = Get-Content $configFile -Raw
          $content = $content -replace 'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[.*\];', "pub const RENDEZVOUS_SERVERS: &[&str] = [`"${{ secrets.RELAY_SERVER }}`"];"
          $content = $content -replace 'pub const RS_PUB_KEY: &str = .*;', "pub const RS_PUB_KEY: &str = `"${{ secrets.PUBLIC_KEY }}`";"
          $content = $content -replace 'pub const API_URL: &str = .*;', "pub const API_URL: &str = `"${{ github.event.inputs.custom_api_url }}`";"
          $content = $content -replace 'pub const FIXED_ID: Option<&str> = None;', "pub const FIXED_ID: Option<&str> = Some(`"${{ github.event.inputs.fixed_id }}`");"
          $content = $content -replace 'pub const FIXED_PASSWORD: Option<&str> = None;', "pub const FIXED_PASSWORD: Option<&str> = Some(`"${{ github.event.inputs.fixed_pass }}`");"
          $content | Set-Content $configFile

          $dartFile = "flutter/lib/main.dart"
          $dartContent = Get-Content $dartFile -Raw
          $dartContent = $dartContent -replace "title: 'RustDesk'", "title: '${{ github.event.inputs.custom_window_title }}'"
          $dartContent = $dartContent -replace "checkUpdate();", "//checkUpdate();"
          $dartContent = $dartContent -replace "enableTelemetry = true;", "enableTelemetry = false;"
          $dartContent | Set-Content $dartFile

      - name: macOS install rust targets
        if: matrix.os == 'macos'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Build RustDesk
        run: |
          cd rustdesk-src
          ${{ matrix.os == 'windows' && './build.bat windows' || './build.sh ' + matrix.os }}

      - name: Rename artifact
        run: |
          cd rustdesk-src/build/out
          ${{ matrix.os == 'ubuntu' && 'mv rustdesk.deb ' + github.event.inputs.custom_app_name + '_linux.deb' || '' }}
          ${{ matrix.os == 'windows' && 'Rename-Item rustdesk.exe ' + github.event.inputs.custom_app_name + '_windows.exe' || '' }}
          ${{ matrix.os == 'macos' && 'mv rustdesk.dmg ' + github.event.inputs.custom_app_name + '_mac.dmg' || '' }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.custom_app_name }}-${{ matrix.os }}
          path: rustdesk-src/build/out
