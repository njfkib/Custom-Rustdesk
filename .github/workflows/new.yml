name: Custom Build RustDesk2026

on:
  workflow_dispatch:

env:
  RUSTUP_DIST_SERVER: https://mirrors.ustc.edu.cn/rust-static
  RUSTUP_UPDATE_ROOT: https://mirrors.ustc.edu.cn/rust-static/rustup
  FLUTTER_VERSION: 3.22.2

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: ./
          submodules: false

      - name: Clone RustDesk source
        run: |
          git clone --depth=1 https://github.com/rustdesk/rustdesk.git rustdesk-src
          cd rustdesk-src
          git submodule update --init --recursive

      - name: Setup system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev pkg-config libgtk-3-dev libayatana-appindicator3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libspeechd-dev libxkbcommon-dev libssl-dev

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustdesk-src

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Modify RustDesk constants (Ubuntu)
        run: |
          cd rustdesk-src
          ls src/common/
          sed -i "s|pub const DEFAULT_RELAY_SERVER: &str = .*|pub const DEFAULT_RELAY_SERVER: &str = \"${{ secrets.RELAY_SERVER }}\";|" src/common/constants.rs
          sed -i "s|pub const DEFAULT_PUB_KEY: &str = .*|pub const DEFAULT_PUB_KEY: &str = \"${{ secrets.PUBLIC_KEY }}\";|" src/common/constants.rs
          sed -i "s|pub const APP_NAME: &str = .*|pub const APP_NAME: &str = \"CustomRustdesk\";|" src/common/constants.rs

      - name: Build RustDesk Linux
        run: |
          cd rustdesk-src
          ./build.sh linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-linux
          path: rustdesk-src/build/out

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: ./
          submodules: false

      - name: Clone RustDesk source
        run: |
          git clone --depth=1 https://github.com/rustdesk/rustdesk.git rustdesk-src
          cd rustdesk-src
          git submodule update --init --recursive

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustdesk-src

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Modify RustDesk constants (Windows)
        run: |
          cd rustdesk-src
          ls src/common/
          $configFile = "src/common/constants.rs"
          (Get-Content $configFile) -replace 'pub const DEFAULT_RELAY_SERVER: &str = .*', "pub const DEFAULT_RELAY_SERVER: &str = `"${{ secrets.RELAY_SERVER }}`";" | Set-Content $configFile
          (Get-Content $configFile) -replace 'pub const DEFAULT_PUB_KEY: &str = .*', "pub const DEFAULT_PUB_KEY: &str = `"${{ secrets.PUBLIC_KEY }}`";" | Set-Content $configFile
          (Get-Content $configFile) -replace 'pub const APP_NAME: &str = .*', "pub const APP_NAME: &str = `"CustomRustdesk`";" | Set-Content $configFile

      - name: Build RustDesk Windows
        run: |
          cd rustdesk-src
          ./build.bat windows

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows
          path: rustdesk-src/build/out

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: ./
          submodules: false

      - name: Clone RustDesk source
        run: |
          git clone --depth=1 https://github.com/rustdesk/rustdesk.git rustdesk-src
          cd rustdesk-src
          git submodule update --init --recursive

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install macOS Rust targets
        run: |
          rustup target add --toolchain stable aarch64-apple-darwin
          rustup target add --toolchain stable x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustdesk-src

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Modify RustDesk constants (macOS)
        run: |
          cd rustdesk-src
          ls src/common/
          sed -i '' "s|pub const DEFAULT_RELAY_SERVER: &str = .*|pub const DEFAULT_RELAY_SERVER: &str = \"${{ secrets.RELAY_SERVER }}\";|" src/common/constants.rs
          sed -i '' "s|pub const DEFAULT_PUB_KEY: &str = .*|pub const DEFAULT_PUB_KEY: &str = \"${{ secrets.PUBLIC_KEY }}\";|" src/common/constants.rs
          sed -i '' "s|pub const APP_NAME: &str = .*|pub const APP_NAME: &str = \"CustomRustdesk\";|" src/common/constants.rs

      - name: Build RustDesk macOS
        run: |
          cd rustdesk-src
          ./build.sh mac

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-macos
          path: rustdesk-src/build/out
