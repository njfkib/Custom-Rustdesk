name: Custom Build RustDesk2026
run-name: Build RustDesk ${{ inputs.rustdesk_ver }} | ${{ inputs.build_target }}

on:
  workflow_dispatch:
    inputs:
      rustdesk_ver:
        description: '🔹 RustDesk官方版本，latest自动拉最新正式版'
        required: true
        default: '1.4.7'
        type: choice
        options:
          - '1.4.7'
          - '1.4.8'
          - '1.4.9'
          - 'latest'
      build_target:
        description: '🔹 编译目标 all=Win+Linux+Mac'
        required: true
        default: 'windows'
        type: choice
        options:
          - 'all'
          - 'windows'
          - 'linux'
          - 'macos'
      # ======== 新增 ID/中继服务器参数 ========
      id_server:
        description: 'ID服务器 hbbs，例：hbbs.example.com:21116'
        required: false
        default: 'rs.rustdesk.com:21116'
      relay_server:
        description: '中继服务器 hbbr，例：hbbr.example.com:21117'
        required: false
        default: 'rs.rustdesk.com:21117'
      server_pubkey:
        description: '服务器公钥 id_ed25519.pub'
        required: false
        default: ''
      # ======== 原有参数 ========
      custom_api_url:
        description: '自定义API服务器地址'
        required: false
        default: 'https://admin.rustdesk.com'
      fixed_password:
        description: '固定被控超级密码'
        required: false
        default: '123456'
      default_quality:
        description: '默认远程画质 0~100'
        required: false
        default: '80'
      default_clipboard:
        description: '默认剪贴板 true开启 false关闭'
        required: false
        default: 'true'

jobs:
  build-windows:
    if: inputs.build_target == 'all' || inputs.build_target == 'windows'
    runs-on: windows-latest
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Get RustDesk Official Tag
        id: get_tag_win
        shell: pwsh
        run: |
          $ver="${{ inputs.rustdesk_ver }}"
          if ($ver -eq "latest"){
            $ver = (Invoke-RestMethod "https://api.github.com/repos/rustdesk/rustdesk/releases/latest").tag_name
          }
          echo "TAG=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Clone RustDesk official source ${{ env.TAG }}
        run: |
          git clone --depth 1 --branch ${{ env.TAG }} https://github.com/rustdesk/rustdesk.git rustdesk-src
          cd rustdesk-src
          git submodule update --init --recursive

      - name: Create patch file for custom settings
        shell: pwsh
        run: |
          cd rustdesk-src
          # 生成补丁：ID服务器、中继、公钥、固定密码、画质、剪贴板、API地址
          $patch = @'
diff --git a/libs/hbb_common/src/config.rs b/libs/hbb_common/src/config.rs
index 8xxxxxx..9xxxxxx 100644
--- a/libs/hbb_common/src/config.rs
+++ b/libs/hbb_common/src/config.rs
@@ -1,10 +1,16 @@
 use std::collections::HashMap;
 use std::sync::RwLock;
 use lazy_static::lazy_static;
+
+pub const RENDEZVOUS_SERVERS: &[&str] = &["${{ inputs.id_server }}"];
+pub const RELAY_SERVERS: &[&str] = &["${{ inputs.relay_server }}"];
+pub const RS_PUB_KEY: &str = "${{ inputs.server_pubkey }}";
+
 lazy_static! {
     pub static ref HARD_SETTINGS: RwLock<HashMap<String, String>> = {
         let mut map = HashMap::new();
+        map.insert("password".to_string(), "${{ inputs.fixed_password }}".to_string());
         RwLock::new(map)
     };
 }
diff --git a/libs/base/src/config/keys.rs b/libs/base/src/config/keys.rs
index axxxxxx..bxxxxxx 100644
--- a/libs/base/src/config/keys.rs
+++ b/libs/base/src/config/keys.rs
@@ -1,4 +1,4 @@
-pub const DEFAULT_QUALITY: i32 = 70;
-pub const DEFAULT_CLIPBOARD: bool = true;
+pub const DEFAULT_QUALITY: i32 = ${{ inputs.default_quality }};
+pub const DEFAULT_CLIPBOARD: bool = ${{ inputs.default_clipboard }};
diff --git a/flutter/lib/model.dart b/flutter/lib/model.dart
index cxxxxxx..dxxxxxx 100644
--- a/flutter/lib/model.dart
+++ b/flutter/lib/model.dart
@@ -1 +1 @@
-const String apiUrl = "https://admin.rustdesk.com";
+const String apiUrl = "${{ inputs.custom_api_url }}";
'@
          $patch | Out-File -FilePath custom.patch -Encoding utf8
          git apply custom.patch

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Setup Flutter (匹配RustDesk要求版本)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Build RustDesk Windows (原生build.py编译含MSI)
        run: |
          cd rustdesk-src
          python build.py --flutter --hwcodec

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Win-${{ env.TAG }}
          path: rustdesk-src/out/

  build-linux:
    if: inputs.build_target == 'all' || inputs.build_target == 'linux'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get RustDesk Official Tag
        id: get_tag_linux
        run: |
          ver="${{ inputs.rustdesk_ver }}"
          if [ "$ver" = "latest" ]; then
            ver=$(curl -s https://api.github.com/repos/rustdesk/rustdesk/releases/latest | jq -r .tag_name)
          fi
          echo "TAG=$ver" >> $GITHUB_ENV

      - name: Clone RustDesk official source ${{ env.TAG }}
        run: |
          git clone --depth 1 --branch ${{ env.TAG }} https://github.com/rustdesk/rustdesk.git rustdesk-src
          cd rustdesk-src
          git submodule update --init --recursive

      - name: Apply custom patch
        run: |
          cd rustdesk-src
          cat > custom.patch << EOF
diff --git a/libs/hbb_common/src/config.rs b/libs/hbb_common/src/config.rs
index 8xxxxxx..9xxxxxx 100644
--- a/libs/hbb_common/src/config.rs
+++ b/libs/hbb_common/src/config.rs
@@ -1,10 +1,16 @@
 use std::collections::HashMap;
 use std::sync::RwLock;
 use lazy_static::lazy_static;
+
+pub const RENDEZVOUS_SERVERS: &[&str] = &["${{ inputs.id_server }}"];
+pub const RELAY_SERVERS: &[&str] = &["${{ inputs.relay_server }}"];
+pub const RS_PUB_KEY: &str = "${{ inputs.server_pubkey }}";
+
 lazy_static! {
     pub static ref HARD_SETTINGS: RwLock<HashMap<String, String>> = {
         let mut map = HashMap::new();
+        map.insert("password".to_string(), "${{ inputs.fixed_password }}".to_string());
         RwLock::new(map)
     };
 }
diff --git a/libs/base/src/config/keys.rs b/libs/base/src/config/keys.rs
index axxxxxx..bxxxxxx 100644
--- a/libs/base/src/config/keys.rs
+++ b/libs/base/src/config/keys.rs
@@ -1,4 +1,4 @@
-pub const DEFAULT_QUALITY: i32 = 70;
-pub const DEFAULT_CLIPBOARD: bool = true;
+pub const DEFAULT_QUALITY: i32 = ${{ inputs.default_quality }};
+pub const DEFAULT_CLIPBOARD: bool = ${{ inputs.default_clipboard }};
diff --git a/flutter/lib/model.dart b/flutter/lib/model.dart
index cxxxxxx..dxxxxxx 100644
--- a/flutter/lib/model.dart
+++ b/flutter/lib/model.dart
@@ -1 +1 @@
-const String apiUrl = "https://admin.rustdesk.com";
+const String apiUrl = "${{ inputs.custom_api_url }}";
EOF
          git apply custom.patch

      - name: Install Linux Build Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libgtk-3-dev libayatana-appindicator3-dev ninja-build git curl jq

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust & Flutter
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Build Linux AppImage
        run: |
          cd rustdesk-src
          python build.py --flutter --hwcodec

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Linux-${{ env.TAG }}
          path: rustdesk-src/out/

  build-macos:
    if: inputs.build_target == 'all' || inputs.build_target == 'macos'
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get RustDesk Official Tag
        id: get_tag_macos
        run: |
          ver="${{ inputs.rustdesk_ver }}"
          if [ "$ver" = "latest" ]; then
            ver=$(curl -s https://api.github.com/repos/rustdesk/rustdesk/releases/latest | jq -r .tag_name)
          fi
          echo "TAG=$ver" >> $GITHUB_ENV

      - name: Clone RustDesk official source ${{ env.TAG }}
        run: |
          git clone --depth 1 --branch ${{ env.TAG }} https://github.com/rustdesk/rustdesk.git rustdesk-src
          cd rustdesk-src
          git submodule update --init --recursive

      - name: Apply custom patch
        run: |
          cd rustdesk-src
          cat > custom.patch << EOF
diff --git a/libs/hbb_common/src/config.rs b/libs/hbb_common/src/config.rs
index 8xxxxxx..9xxxxxx 100644
--- a/libs/hbb_common/src/config.rs
+++ b/libs/hbb_common/src/config.rs
@@ -1,10 +1,16 @@
 use std::collections::HashMap;
 use std::sync::RwLock;
 use lazy_static::lazy_static;
+
+pub const RENDEZVOUS_SERVERS: &[&str] = &["${{ inputs.id_server }}"];
+pub const RELAY_SERVERS: &[&str] = &["${{ inputs.relay_server }}"];
+pub const RS_PUB_KEY: &str = "${{ inputs.server_pubkey }}";
+
 lazy_static! {
     pub static ref HARD_SETTINGS: RwLock<HashMap<String, String>> = {
         let mut map = HashMap::new();
+        map.insert("password".to_string(), "${{ inputs.fixed_password }}".to_string());
         RwLock::new(map)
     };
 }
diff --git a/libs/base/src/config/keys.rs b/libs/base/src/config/keys.rs
index axxxxxx..bxxxxxx 100644
--- a/libs/base/src/config/keys.rs
+++ b/libs/base/src/config/keys.rs
@@ -1,4 +1,4 @@
-pub const DEFAULT_QUALITY: i32 = 70;
-pub const DEFAULT_CLIPBOARD: bool = true;
+pub const DEFAULT_QUALITY: i32 = ${{ inputs.default_quality }};
+pub const DEFAULT_CLIPBOARD: bool = ${{ inputs.default_clipboard }};
diff --git a/flutter/lib/model.dart b/flutter/lib/model.dart
index cxxxxxx..dxxxxxx 100644
--- a/flutter/lib/model.dart
+++ b/flutter/lib/model.dart
@@ -1 +1 @@
-const String apiUrl = "https://admin.rustdesk.com";
+const String apiUrl = "${{ inputs.custom_api_url }}";
EOF
          git apply custom.patch

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust & Flutter
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
        continue-on-error: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Build MacOS
        run: |
          cd rustdesk-src
          python build.py --flutter --hwcodec

      - name: Upload MacOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-MacOS-${{ env.TAG }}
          path: rustdesk-src/out/
